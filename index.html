<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Space Fleet - Equipment Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #1a1a1a;
            color: #e5e5e5;
        }

        /* Custom Colors for Tiers / Text */
        .color-white { color: #ffffff; }
        .color-green { color: #4ade80; }
        .color-blue { color: #60a5fa; }
        .color-pink { color: #e879f9; }
        .color-yellow { color: #facc15; }
        .color-red { color: #f87171; }
        .color-orange { color: #fb923c; }
        .color-cyan { color: #22d3ee; }

        .table-container {
            background-color: #262626;
            border: 1px solid #404040;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #404040;
            padding: 8px 12px;
            text-align: center;
            white-space: nowrap;
        }

        td:first-child {
            text-align: right;
            border-right: 1px solid #404040;
            font-weight: 600;
        }

        .strike { text-decoration: line-through; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-5xl mb-6 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-bold text-white mb-2">Idle Space Fleet</h1>
            <p class="text-gray-400">Equipment Reference & Image Generator</p>
        </div>
        <button onclick="downloadTableImage()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded shadow transition flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Export to Image
        </button>
    </div>

    <!-- Tabs -->
    <div class="w-full max-w-5xl flex gap-2 mb-4 border-b border-gray-700 pb-2">
        <button onclick="switchTab('Defense')" id="tab-Defense" class="tab-btn px-4 py-2 rounded bg-gray-700 text-white font-bold">Defense Equipment</button>
        <button onclick="switchTab('Support')" id="tab-Support" class="tab-btn px-4 py-2 rounded text-gray-400 hover:text-white">Support Equipment</button>
        <button onclick="switchTab('Weapon')" id="tab-Weapon" class="tab-btn px-4 py-2 rounded text-gray-400 hover:text-white">Weapon Equipment</button>
        <button onclick="switchTab('Fleet')" id="tab-Fleet" class="tab-btn px-4 py-2 rounded text-gray-400 hover:text-white">Fleet Equipment</button>
    </div>

    <!-- Table Export Area -->
    <div id="exportArea" class="w-full max-w-5xl table-container rounded p-4">
        <h2 id="tableTitle" class="text-2xl font-bold text-center text-white mb-4">Defense Equipment</h2>
        
        <div class="overflow-x-auto">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th></th> <!-- Empty top-left -->
                        <!-- The colors of the columns based on the image -->
                        <th class="color-white">Tier 1</th>
                        <th class="color-green">Tier 2</th>
                        <th class="color-blue">Tier 3</th>
                        <th class="color-pink">Tier 4</th>
                        <th class="color-yellow">Tier 5</th>
                        <th class="color-red">Tier 6</th>
                        <th class="color-orange">Tier 7</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be generated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Data structure based on the provided screenshots
        const equipmentData = {
            "Defense": [
                { name: "Barrier Shield regen", color: "color-white", vals: ["+20%", "+30%", "+40%", "+60%", "?", "?", "?"] },
                { name: "Percent defense", color: "color-white", vals: ["+1.0%", "+1.5%", "+2.0%", "+3.0%", "+5.0%", "?", "?"] },
                { name: "Absolute defense", color: "color-white", vals: ["+15%", "+20%", "+25%", "+40%", "+100%", "?", "?"] },
                { name: "Nova Mines recovery percent ?", color: "color-pink", vals: ["", "", "", "?", "?", "?", "?"] },
                { name: "Nova Mines radius ?", color: "color-pink", vals: ["", "", "", "?", "?", "?", "?"] },
                { name: "Nova Mines spawn chance", color: "color-white", vals: ["+0.5%", "+1.0%", "+2.0%", "+3.0%", "?", "?", "?"] },
                { name: "Shield Surge charge percent ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Shield Surge max shield multiplier", color: "color-cyan", vals: ["", "", "+0.2x", "?", "+0.7x", "?", "?"] },
                { name: "Shield Surge cooldown ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Displacement Cannon chance", color: "color-yellow", vals: ["", "", "", "", "+4%", "?", "?"] },
                { name: "Displacement Cannon force ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Wormhole distance ?", color: "color-red", vals: ["", "", "", "", "", "?", "?"] },
                { name: "Wormhole cooldown ?", color: "color-orange", vals: ["", "", "", "", "", "", "?"] },
                { name: "System Restore trigger chance", color: "color-pink", vals: ["", "", "", "+0.1%", "?", "?", "?"] },
                { name: "System Restore shield ?", color: "color-pink", vals: ["", "", "", "?", "?", "?", "?"] }
            ],
            "Support": [
                { name: "Energy Amplifier multiplier ?", color: "color-white", vals: ["", "", "", "", "", "", ""] },
                { name: "Energy Amplifier energy / dist.", color: "color-white", vals: ["+30", "+40", "+50", "+100", "+200", "+500", "?"] },
                { name: "Credit Amplifier multiplier", color: "color-white", vals: ["+2%", "+3%", "+4%", "?", "+8%", "+10%", "?"] },
                { name: "Credit Amplifier credits / distance", color: "color-white", vals: ["+20", "+25", "+35", "?", "?", "?", "?"] },
                { name: "AutoPilot weapon chance", color: "color-white", vals: ["+2%", "+3%", "+4%", "+6%", "+8%", "+10%", "?"] },
                { name: "AutoPilot defense chance", color: "color-white", vals: ["+2%", "+3%", "+4%", "+6%", "+8%", "+10%", "?"] },
                { name: "AutoPilot support chance", color: "color-white", vals: ["+2%", "+3%", "+4%", "+6%", "+8%", "+10%", "?"] },
                { name: "Critical Strike chance", color: "color-white", vals: ["+1%", "+2%", "+3%", "+4%", "+6%", "?", "?"] },
                { name: "Critical Strike damage factor", color: "color-white", vals: ["+2x", "+3x", "+4x", "+6x", "?", "?", "?"] },
                { name: "Supply Scanner energy ?", color: "color-yellow strike", vals: ["", "", "", "", "", "", ""] },
                { name: "Supply Scanner credits ?", color: "color-yellow strike", vals: ["", "", "", "", "", "", ""] },
                { name: "Supply Scanner cooldown ?", color: "color-yellow strike", vals: ["", "", "", "", "", "", ""] },
                { name: "Hyperdrive multiplier ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Hyperdrive cooldown", color: "color-pink", vals: ["", "", "", "-5s", "-10s", "-15s", "?"] },
                { name: "Super Critical Strike chance", color: "color-pink", vals: ["", "", "", "+3%", "?", "?", "?"] },
                { name: "Super Critical Strike damage factor", color: "color-pink", vals: ["", "", "", "+2x", "?", "?", "?"] }
            ],
            "Weapon": [
                { name: "Core Cannon attack speed", color: "color-white", vals: ["+0.3", "+0.4", "+0.5", "+0.7", "+1.0", "?", "?"] },
                { name: "Missile Launcher damage", color: "color-white", vals: ["+10%", "+15%", "+20%", "+40%", "?", "?", "?"] },
                { name: "Missile Launcher quantity ?", color: "color-yellow strike", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Missile Launcher cooldown ?", color: "color-yellow strike", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Energy Beam damage", color: "color-white", vals: ["+5.0%", "+7.5%", "+10.0%", "?", "?", "?", "?"] },
                { name: "Energy Beam damage ticks", color: "color-white", vals: ["+1", "+2", "?", "?", "?", "?", "?"] },
                { name: "Disruptor Field damage", color: "color-yellow", vals: ["", "", "", "", "+4%", "?", "?"] },
                { name: "Disruptor Field size ?", color: "color-yellow strike", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Disruptor Field cooldown ?", color: "color-yellow strike", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Satellite quantity ?", color: "color-red", vals: ["", "", "", "", "", "?", "?"] },
                { name: "Satellite orbiting speed", color: "color-yellow", vals: ["", "", "", "", "+1.5", "?", "?"] },
                { name: "Multishot Cannon proc chance", color: "color-yellow", vals: ["", "", "", "", "+7%", "?", "?"] },
                { name: "Multishot Cannon targets ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Plasma Cannon proc chance ?", color: "color-red", vals: ["", "", "", "", "", "?", "?"] },
                { name: "Plasma Cannon chains", color: "color-pink", vals: ["", "", "", "+1", "+2", "?", "?"] },
                { name: "Range Amplifier range ?", color: "color-yellow", vals: ["", "", "", "", "?", "?", "?"] },
                { name: "Range Amplifier damage / range", color: "color-white", vals: ["+0.5%", "+1.0%", "+1.5%", "?", "?", "?", "?"] }
            ],
            "Fleet": [
                { name: "Carrier fighter damage", color: "color-white", vals: ["+2x", "+4x", "+6x", "?", "+16x", "+40x", "?"] },
                { name: "Carrier - Capacity", color: "color-yellow", vals: ["", "", "", "", "+3", "+4", "?"] },
                { name: "Ionizer - 1 ?", color: "color-cyan", vals: ["", "", "", "", "", "", ""] },
                { name: "Ionizer - 2 ?", color: "color-cyan", vals: ["", "", "", "", "", "", ""] },
                { name: "Nebula damage multiplier", color: "color-white", vals: ["+8x", "+15x", "+25x", "+35x", "+50x", "+100x", "?"] },
                { name: "Nebula size", color: "color-red", vals: ["", "", "", "", "", "+2", "?"] },
                { name: "Prospector resource multiplier", color: "color-white", vals: ["?", "?", "+0.5x", "?", "?", "?", "?"] },
                { name: "Prospector - Duration", color: "color-white", vals: ["", "", "", "", "", "", ""] },
                { name: "Rampart shield capacity", color: "color-white", vals: ["+0.2x", "+0.4x", "+0.6x", "?", "?", "+2.0x", "?"] },
                { name: "Rampart - regen/s ?", color: "color-white", vals: ["", "", "", "", "", "", ""] },
                { name: "Rampart - restore ?", color: "color-white", vals: ["", "", "", "", "", "", ""] },
                { name: "Ravager damage multiplier", color: "color-white", vals: ["+1.0", "+2.5", "+3.5", "+5.0", "+10", "?", "?"] },
                { name: "Ravager shield gained from kills", color: "color-yellow", vals: ["", "", "", "", "+200%", "?", "?"] },
                { name: "Ray damage multiplier", color: "color-white", vals: ["+3x", "+5x", "?", "?", "?", "?", "?"] },
                { name: "Ray pulse damage ticks", color: "color-yellow", vals: ["", "", "", "", "+1", "?", "?"] },
                { name: "Sentinel mine damage multiplier", color: "color-white", vals: ["+8x", "+15x", "+25x", "+35x", "?", "+100x", "?"] },
                { name: "Sentinel detection range", color: "color-yellow", vals: ["", "", "", "", "+2", "?", "?"] },
                { name: "Singularity radius", color: "color-white", vals: ["+0.5", "+1.0", "?", "+2.0", "+2.5", "?", "?"] },
                { name: "Singularity duration", color: "color-yellow", vals: ["", "", "", "", "+2s", "?", "?"] },
                { name: "Solar Flare damage multiplier", color: "color-white", vals: ["+1.0x", "+2.5x", "?", "+5.0x", "+10.0x", "?", "?"] },
                { name: "Solar Flare duration", color: "color-white", vals: ["+1s", "+2s", "+3s", "?", "+5s", "?", "?"] }
            ]
        };

        const columnColors = [
            "color-white", "color-green", "color-blue", "color-pink", 
            "color-yellow", "color-red", "color-orange"
        ];

        let currentTab = "Defense";

        function renderTable(tabName) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const data = equipmentData[tabName];
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                
                // Name Column
                const tdName = document.createElement('td');
                tdName.className = row.color;
                tdName.innerText = row.name;
                tr.appendChild(tdName);

                // Value Columns
                row.vals.forEach((val, index) => {
                    const tdVal = document.createElement('td');
                    tdVal.className = columnColors[index];
                    tdVal.innerText = val;
                    tr.appendChild(tdVal);
                });

                tbody.appendChild(tr);
            });
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update Title
            document.getElementById('tableTitle').innerText = tabName + " Equipment";
            
            // Reset Tab Styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded text-gray-400 hover:text-white";
            });
            
            // Set Active Tab Style
            const activeBtn = document.getElementById('tab-' + tabName);
            activeBtn.className = "tab-btn px-4 py-2 rounded bg-gray-700 text-white font-bold";

            renderTable(tabName);
        }

        function downloadTableImage() {
            const exportArea = document.getElementById('exportArea');
            
            html2canvas(exportArea, {
                backgroundColor: '#262626',
                scale: 2 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `IdleSpaceFleet_${currentTab}_Equipment.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Initialize first tab
        switchTab('Defense');
    </script>
</body>
</html>
